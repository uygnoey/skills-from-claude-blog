# Continuous evals in CI — .github/workflows/agent-evals.yml
#
# The suite runs non-interactively on a schedule and on any change to CLAUDE.md,
# skills or hooks, since that configuration steers the agent and deserves the
# regression testing that code gets. Gate configuration changes on the results:
# a skill change that drops the pass rate gets reviewed before it merges.
name: Agent evals
on:
  pull_request:
    paths: ['CLAUDE.md', '.claude/**']
  schedule:
    - cron: '0 2 * * *'
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for eval in evals/*.json; do
            claude -p "$(jq -r '.prompt' $eval)" \
              --allowedTools "Read,Edit,Bash(make test)" \
              --output-format json > result.json
            ./evals/check.sh "$eval" result.json
          done
